<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gim Edukasi ULP — Prosedur Kesehatan, Keselamatan &amp; Keamanan dalam Bekerja</title>
  <style>
    /* =========================================================
   GIM EDUKASI ULP (P_ULP_4)
   Tampilan memakai gambar rancangan asli dari storyboard PDF;
   tombol & panel interaktif diletakkan tepat di atas gambar.
   ========================================================= */
    :root {
      --u: 13px;
      --navy: #0d2b4a;
      --biru: #1c7ed6;
      --sian: #3ad7ff;
      --hijau: #2ecc71;
      --kuning: #ffd23c;
      --merah: #d5342f;
      --oranye: #f0a04a;
      --ungu: #7d5bd6;
      --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: #03101d;
      font-family: var(--font);
      overflow: hidden;
      color: #fff
    }

    #panggung {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, 177.78vh);
      height: min(56.25vw, 100vh);
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 60px rgba(0, 0, 0, .85)
    }

    .adegan {
      position: absolute;
      inset: 0;
      display: none;
      background-size: 100% 100%;
      background-position: center
    }

    .adegan.aktif {
      display: block;
      animation: masuk .45s ease
    }

    .adegan.geser.aktif {
      animation: geser .45s cubic-bezier(.22, .9, .3, 1)
    }

    @keyframes masuk {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes geser {
      from {
        opacity: 0;
        transform: translateX(6%)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hot {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      border-radius: calc(var(--u)*.9);
      transition: transform .16s, box-shadow .16s, background .16s
    }

    .hot:hover {
      transform: scale(1.03);
      background: rgba(58, 215, 255, .16);
      box-shadow: 0 0 0 calc(var(--u)*.15) rgba(58, 215, 255, .9), 0 0 calc(var(--u)*1.8) rgba(58, 215, 255, .7)
    }

    .hot:active {
      transform: scale(.98)
    }

    .hot.bulat {
      border-radius: 50%
    }

    .hot.denyut {
      animation: denyut 2.5s ease-in-out infinite
    }

    @keyframes denyut {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(58, 215, 255, 0)
      }

      50% {
        box-shadow: 0 0 0 calc(var(--u)*.18) rgba(58, 215, 255, .5)
      }
    }

    .hot:hover.denyut {
      animation: none
    }

    .hot.kunci {
      cursor: not-allowed
    }

    .hot.kunci:hover {
      transform: none;
      background: rgba(255, 60, 60, .16);
      box-shadow: 0 0 0 calc(var(--u)*.15) rgba(255, 90, 90, .85)
    }

    .hot.pilih-benar {
      background: rgba(46, 204, 113, .28);
      box-shadow: 0 0 0 calc(var(--u)*.18) #2ecc71, 0 0 calc(var(--u)*1.8) rgba(46, 204, 113, .9);
      animation: none
    }

    .hot.pilih-salah {
      background: rgba(213, 52, 47, .28);
      box-shadow: 0 0 0 calc(var(--u)*.18) #d5342f, 0 0 calc(var(--u)*1.8) rgba(213, 52, 47, .9);
      animation: none
    }

    .hot.terpakai {
      opacity: 0;
      pointer-events: none
    }

    .tip {
      position: absolute;
      left: 50%;
      bottom: 104%;
      transform: translateX(-50%) translateY(.4em);
      background: #062038;
      color: #eaf6ff;
      border: 1px solid var(--sian);
      border-radius: .5em;
      padding: .35em .7em;
      font-size: calc(var(--u)*1);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: .18s;
      z-index: 9
    }

    .hot:hover .tip {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .gearbtn {
      position: absolute;
      right: 1.5%;
      top: 1.5%;
      width: 6.5%;
      height: 8%;
      border-radius: 50%;
      background: rgba(9, 30, 52, .72);
      border: 2px solid rgba(255, 255, 255, .5);
      color: #fff;
      font-size: calc(var(--u)*1.6);
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 5
    }

    .gearbtn:hover {
      background: rgba(28, 126, 214, .8)
    }

    .backbtn {
      position: absolute;
      left: 1%;
      top: 91%;
      width: 16%;
      height: 8%;
      border-radius: calc(var(--u)*.8);
      background: rgba(9, 30, 52, .72);
      border: 2px solid rgba(255, 255, 255, .5);
      color: #fff;
      font-size: calc(var(--u)*1.1);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .3em;
      cursor: pointer;
      z-index: 5
    }

    .backbtn:hover {
      background: rgba(28, 126, 214, .8)
    }

    .ov {
      position: absolute;
      border-radius: calc(var(--u)*.7);
      font-size: calc(var(--u)*1.1);
      line-height: 1.3;
      background: linear-gradient(180deg, rgba(8, 32, 60, .94), rgba(4, 18, 34, .94));
      border: calc(var(--u)*.1) solid var(--sian);
      color: #eaf6ff;
      padding: calc(var(--u)*.4) calc(var(--u)*.6);
      box-shadow: 0 0 calc(var(--u)*1.2) rgba(58, 215, 255, .4);
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .ov .judul {
      color: var(--sian);
      font-weight: 700;
      letter-spacing: .05em;
      font-size: calc(var(--u)*.95);
      text-align: center
    }

    .ov .nilai {
      font-size: calc(var(--u)*1.9);
      font-weight: 800;
      text-align: center;
      line-height: 1;
      color: var(--kuning)
    }

    .ov.solid {
      background: #0b2b4d;
      border-color: #1a4a7a
    }

    .hijau {
      color: #5ef08f
    }

    .kuningx {
      color: var(--kuning)
    }

    .merahx {
      color: #ff7b76
    }

    /* deskripsi item p3k */
    .deskripsi-p3k {
      position: absolute;
      left: 27.5%;
      top: 59%;
      width: 48%;
      height: 31%;
      background: rgba(9, 25, 42, .97);
      border: calc(var(--u)*.1) solid #2a4a6b;
      border-radius: calc(var(--u)*.6);
      padding: calc(var(--u)*.6) calc(var(--u)*.8);
      display: flex;
      gap: calc(var(--u)*.8);
      align-items: flex-start;
      color: #eaf2fa
    }

    .deskripsi-p3k .ik {
      font-size: calc(var(--u)*3);
      flex: none
    }

    .deskripsi-p3k b {
      color: var(--sian);
      display: block;
      margin-bottom: .2em;
      font-size: calc(var(--u)*1.15)
    }

    .deskripsi-p3k p {
      font-size: calc(var(--u)*.98);
      line-height: 1.4;
      color: #cfe0f0
    }

    .progres-p3k {
      position: absolute;
      left: 44%;
      top: 91.5%;
      width: 29%;
      height: 6%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5em
    }

    .dotp3k {
      width: calc(var(--u)*1.6);
      height: calc(var(--u)*1.6);
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      border: 2px solid rgba(255, 255, 255, .35);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: calc(var(--u)*.85);
      font-weight: 700
    }

    .dotp3k.on {
      background: #2ecc71;
      border-color: #2ecc71;
      color: #04270f
    }

    /* popup */
    .tirai {
      position: absolute;
      inset: 0;
      background: rgba(2, 10, 20, .66);
      backdrop-filter: blur(6px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      animation: masuk .2s
    }

    .tirai.tampil {
      display: flex
    }

    .gambar-modal {
      position: relative;
      width: 52%;
      animation: pop .34s cubic-bezier(.2, 1.4, .4, 1)
    }

    .gambar-modal img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 calc(var(--u)*1) calc(var(--u)*2) rgba(0, 0, 0, .65));
      border-radius: calc(var(--u)*1)
    }

    @keyframes pop {
      from {
        transform: scale(.25);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .kartu {
      background: #fff;
      color: #16283d;
      border-radius: calc(var(--u)*1.1);
      width: 54%;
      padding: calc(var(--u)*1.4) calc(var(--u)*1.7);
      box-shadow: 0 calc(var(--u)*1) calc(var(--u)*3) rgba(0, 0, 0, .6);
      animation: pop .34s cubic-bezier(.2, 1.4, .4, 1);
      position: relative
    }

    .kartu .kepala {
      display: flex;
      align-items: center;
      gap: calc(var(--u)*.9);
      margin-bottom: calc(var(--u)*.8)
    }

    .kartu .kepala img {
      width: calc(var(--u)*4);
      height: calc(var(--u)*4);
      border-radius: 50%;
      object-fit: cover;
      border: calc(var(--u)*.15) solid #1c7ed6
    }

    .kartu h3 {
      font-size: calc(var(--u)*1.85);
      color: #0b2545;
      line-height: 1.2
    }

    .kartu p {
      font-size: calc(var(--u)*1.15);
      line-height: 1.5;
      color: #2c3e52
    }

    .kartu .aksi {
      display: flex;
      gap: calc(var(--u)*.8);
      justify-content: flex-end;
      margin-top: calc(var(--u)*1.1);
      flex-wrap: wrap
    }

    .tutup {
      position: absolute;
      right: calc(var(--u)*-.8);
      top: calc(var(--u)*-.8);
      width: calc(var(--u)*2.9);
      height: calc(var(--u)*2.9);
      border-radius: 50%;
      background: linear-gradient(180deg, #e8524d, #b3241f);
      border: calc(var(--u)*.2) solid #fff;
      color: #fff;
      font-size: calc(var(--u)*1.3);
      cursor: pointer
    }

    .tombol {
      border: none;
      border-radius: calc(var(--u)*.7);
      cursor: pointer;
      font-family: var(--font);
      font-weight: 800;
      font-size: calc(var(--u)*1.15);
      padding: calc(var(--u)*.55) calc(var(--u)*1.2);
      color: #fff;
      box-shadow: 0 calc(var(--u)*.3) 0 rgba(0, 0, 0, .3);
      transition: .15s
    }

    .tombol:hover {
      filter: brightness(1.12)
    }

    .tombol.abu {
      background: linear-gradient(180deg, #98a6b4, #6c7a89)
    }

    .tombol.biru {
      background: linear-gradient(180deg, #3f9ae8, #1256a0)
    }

    .tombol.hijau {
      background: linear-gradient(180deg, #5ac878, #238b45)
    }

    .tombol.oranye {
      background: linear-gradient(180deg, #f2a45c, #d2761c)
    }

    .toast {
      position: absolute;
      z-index: 30;
      max-width: 35%;
      background: #0a2a4a;
      color: #eaf6ff;
      border-left: calc(var(--u)*.4) solid var(--sian);
      border-radius: calc(var(--u)*.6);
      padding: calc(var(--u)*.65) calc(var(--u)*.85);
      font-size: calc(var(--u)*1.05);
      line-height: 1.35;
      box-shadow: 0 calc(var(--u)*.5) calc(var(--u)*1.4) rgba(0, 0, 0, .6);
      animation: pop .28s
    }

    .toast.buruk {
      border-left-color: var(--merah)
    }

    .toast b {
      display: block;
      color: var(--sian);
      margin-bottom: .2em
    }

    /* level 2 kuis */
    .timerbar {
      height: calc(var(--u)*.6);
      border-radius: 999px;
      background: #00000030;
      overflow: hidden
    }

    .timerbar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
      transition: width .3s linear
    }

    /* level 3 drag drop */
    .itemdot {
      position: absolute;
      width: calc(var(--u)*1.4);
      height: calc(var(--u)*1.4);
      border-radius: 50%;
      background: rgba(255, 255, 255, .25);
      border: 2px solid rgba(255, 255, 255, .4);
      top: 1.5%
    }

    .itemdot.on {
      background: var(--hijau);
      border-color: var(--hijau)
    }

    .dzstat {
      position: absolute;
      font-size: calc(var(--u)*2.4);
      color: #2ecc71;
      text-shadow: 0 0 10px rgba(46, 204, 113, .8);
      display: none;
      pointer-events: none
    }

    /* sertifikat overlay — menutup penuh teks skor statis pada gambar (x20-90%,y0-27%) */
    .skorpanel {
      position: absolute;
      left: 21%;
      top: 0%;
      width: 68%;
      height: 30%;
      background: radial-gradient(ellipse at center, #0d2a4d 0%, #081a30 75%, #050f1e 100%);
      border-radius: 0 0 calc(var(--u)*3) calc(var(--u)*3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .1em;
      box-shadow: 0 calc(var(--u)*.4) calc(var(--u)*1.2) rgba(0, 0, 0, .5)
    }

    .bintangbox {
      font-size: calc(var(--u)*2.1);
      color: #ffcc33;
      letter-spacing: .15em;
      text-shadow: 0 0 10px rgba(255, 204, 51, .8)
    }

    .skorpanel .angka {
      font-family: var(--font);
      font-weight: 900;
      font-size: calc(var(--u)*3);
      color: #ffd76a;
      text-shadow: 0 0 18px rgba(255, 215, 100, .7);
      letter-spacing: .02em;
      line-height: 1
    }

    .skorpanel .status {
      font-size: calc(var(--u)*1.15);
      color: #5ef08f;
      font-weight: 700
    }
  </style>
</head>

  <script src="tone.js"></script>
<script>const __VO_AUDIO__={"Halo! Selamat datang di Gim Edukasi Usaha Layanan Pariwisata. Ketuk tombol Mulai untuk masuk.": "audio/vo_001_d3d42fd49f.m4a", "Halo! Selamat datang di Gim Edukasi Usaha Layanan Pariwisata bersama saya, Pak Andi. Ketuk Belajar Materi untuk memulai, atau Main Gim jika kamu sudah siap ditantang!": "audio/vo_002_5839b0fc32.m4a", "Di Modul empat ini kita akan mempelajari tiga aspek penting operasional pariwisata: ergonomi kelayakan tour, tanggap darurat, dan standar penampilan atau grooming.": "audio/vo_003_56d155e844.m4a", "Keselamatan dan kenyamanan wisatawan dimulai dari kelayakan armada. Pilih salah satu dari tiga aspek berikut.": "audio/vo_004_9f9aebdb3f.m4a", "Saat memandu tour, situasi darurat bisa terjadi kapan saja. Sebagai pramuwisata profesional kita harus selalu siap siaga!": "audio/vo_005_0d4c2222a0.m4a", "Sebagai pemandu wisata, kotak P3K adalah senjata utama kita saat ada wisatawan terluka ringan. Klik satu per satu isi tas untuk melihat kegunaannya.": "audio/vo_006_343071855a.m4a", "Penampilan fisik kita adalah hal pertama yang dilihat wisatawan. Ketuk Mulai Inspeksi Diri untuk memeriksa kelengkapan atribut kerja.": "audio/vo_007_8ec5388174.m4a", "Periksa detail atributmu satu per satu: rambut atau hijab, ID card, dan sepatu lapangan.": "audio/vo_008_76f5c0a627.m4a", "Selamat datang di Gim Arena Pariwisata! Selesaikan tantangan di setiap level, mulai dari mengaudit bus wisata hingga menguasai prosedur darurat dan grooming.": "audio/vo_009_e870b3d5b5.m4a", "Selamat datang di audit bus pariwisata. Tugasmu memastikan bus layak dan aman. Perhatikan area duduk, instalasi listrik, dan kebersihan lantai. Temukan tiga pelanggaran secepat mungkin!": "audio/vo_010_d8b7533d2f.m4a", "Gempa terjadi! Tetap tenang, jangan panik. Keselamatan tamu adalah prioritas nomor satu. Pilih tindakan yang paling tepat.": "audio/vo_011_b849ff29a0.m4a", "Ini tahap akhir. Pastikan seragam dan atributmu sesuai standar profesional. Jangan sampai salah menggunakan alas kaki! Kamu punya waktu enam puluh detik.": "audio/vo_012_a94bf99e0b.m4a", "Luar biasa! Kamu menunjukkan performa yang sangat kompeten. Dengan sertifikat ini kamu resmi menjadi bagian dari tim profesional pariwisata Indonesia.": "audio/vo_013_87ad0ded5b.m4a", "Perjalanan jarak jauh bisa sangat melelahkan bagi wisatawan jika postur duduknya salah. Ketuk tombol putar kartu untuk membaca lima poin penting menjaga kenyamanan fisik penumpang.": "audio/vo_014_c78f4b6d15.m4a", "Postur ergonomis membantu mengurangi kelelahan, mencegah cedera, dan menjaga kenyamanan selama perjalanan jauh: kepala tegak tidak menunduk, punggung menempel sandaran, tangan rileks, kaki menapak rata di lantai, dan lakukan istirahat berkala setiap 1–2 jam.": "audio/vo_015_08910f8faa.m4a", "Fasilitas pengisian daya di dalam bus sangat penting untuk wisatawan, tetapi penggunaannya tidak boleh sembarangan. Pelajari cara mencegah risiko beban lebih dan korsleting listrik selama perjalanan.": "audio/vo_016_2d9fc018c2.m4a", "Gunakan sesuai kapasitas, hindari penggunaan bertumpuk, jangan modifikasi kelistrikan, periksa secara berkala, dan matikan bila tidak digunakan. Beban listrik berlebih dapat menyebabkan korsleting, kerusakan perangkat, hingga kebakaran.": "audio/vo_017_8d6f877b33.m4a", "Selain mesin, lingkungan dalam kabin juga harus sehat! Udara pengap dan lampu terlalu redup bisa membuat penumpang pusing dan mabuk perjalanan. Pelajari standar Lux dan sirkulasi idealnya.": "audio/vo_018_f9235a4907.m4a", "Standar pencahayaan ideal: lampu kabin umum 100–150 Lux, lampu baca individu 150–200 Lux, lampu malam 10–30 Lux. Ventilasi ideal: sirkulasi udara segar 6–10 kali/jam, suhu 22–26°C, kelembapan 40–60% RH.": "audio/vo_019_18a83d96c3.m4a", "Ketika terjadi kondisi darurat seperti kebakaran di lokasi wisata, jangan pernah menggunakan lift! Arahkan seluruh wisatawan dengan tenang melewati tangga darurat menuju titik kumpul aman.": "audio/vo_020_a4c4b40926.m4a", "Prosedur evakuasi darurat: (1) Jangan gunakan lift — dapat mati listrik atau terjebak. (2) Gunakan tangga darurat terdekat yang ditandai rambu EXIT. (3) Menuju titik kumpul aman dan lakukan pendataan rombongan. Tetap tenang, jangan berlari, jangan kembali ke area berbahaya.": "audio/vo_021_a16935c244.m4a", "Setiap kejadian luar biasa seperti kehilangan barang berharga atau kecelakaan harus dilaporkan cepat dan valid. Batas waktu maksimal dua kali dua puluh empat jam melalui sistem digital.": "audio/vo_022_b8c0b2df26.m4a", "SOP pelaporan insiden: laporkan maksimal 2×24 jam sejak kejadian, gunakan sistem pelaporan digital (sertakan kronologi, lokasi, dokumentasi), laporan diteruskan ke kantor pusat/instansi terkait, lalu tim pusat menindaklanjuti hingga kasus ditutup. Jangan menunda pelaporan.": "audio/vo_023_4679410874.m4a", "KASA STERIL dan PERBAN. Digunakan untuk menutup luka agar tetap bersih, menghentikan perdarahan ringan, dan melindungi luka dari kontaminasi kotoran atau bakteri. Balut dengan tekanan secukupnya dan jangan terlalu ketat agar aliran darah tetap lancar.": "audio/vo_024_2bd79a43b2.m4a", "ANTISEPTIK CAIR. Membersihkan luka dari kuman sebelum ditutup. Tuangkan pada kasa, lalu usapkan dari bagian tengah luka ke arah luar. Hindari penggunaan pada luka bakar berat atau luka yang sangat dalam.": "audio/vo_025_0d18254ce9.m4a", "SALEP LUKA. Mempercepat penyembuhan luka ringan, lecet, atau gigitan serangga, serta mencegah infeksi. Oleskan tipis pada kulit yang sudah dibersihkan; hentikan pemakaian bila timbul reaksi alergi.": "audio/vo_026_c9634592de.m4a", "RAMBUT / HIJAB. Kerapian, kebersihan, dan kesesuaian gaya rambut atau hijab sesuai standar pramuwisata profesional. Rambut dipotong/ditata rapi, tidak menutupi wajah; hijab disematkan rapi tanpa juntaian yang mengganggu aktivitas lapangan.": "audio/vo_027_8de5606322.m4a", "ID CARD / LENCANA PRAMUWISATA. ID Card dan lencana wajib digunakan dengan benar, terbaca jelas, dan selalu dibawa saat bertugas. ID Card digantung pada lanyard resmi di dada tengah dengan foto dan nama menghadap ke depan.": "audio/vo_028_0fad8d1406.m4a", "SEPATU LAPANGAN. Sepatu harus bersih, terawat, nyaman digunakan, dan sesuai kebutuhan aktivitas lapangan. Gunakan sepatu tertutup dengan sol anti-selip; sandal jepit dilarang karena berisiko cedera.": "audio/vo_029_1d4ff1ac92.m4a", "KURSI RUSAK. Sandaran kursi patah diperbaiki — penumpang aman saat pengereman mendadak.": "audio/vo_030_bce65b8de9.m4a", "STOP KONTAK KELEBIHAN BEBAN. Colokan bertumpuk dilepas dan kabel dirapikan — risiko korsleting hilang.": "audio/vo_031_8e6aea0eb1.m4a", "LANTAI BASAH dan LICIN. Tumpahan dibersihkan dan dipasang rambu peringatan — risiko terpeleset teratasi.": "audio/vo_032_99303901ea.m4a", "Waktu habis! Nyawa berkurang satu.": "audio/vo_033_6766cd920c.m4a", "Saat guncangan: lindungi kepala di bawah furnitur kokoh. Setelah reda: evakuasi lewat tangga darurat — jangan gunakan lift.": "audio/vo_034_3ea8d7d024.m4a", "Berkumpul di titik kumpul lalu hitung jumlah rombongan. Jangan pernah kembali ke area berbahaya.": "audio/vo_035_ec12256b21.m4a", "Prosedur: CEK kondisi korban → AMANKAN → TINDAK pertolongan pertama → LAPOR maksimal 2×24 jam.": "audio/vo_036_3d0aadc1c2.m4a", "Item ini tidak sesuai standar grooming pemandu wisata. Ditolak otomatis.": "audio/vo_037_edeee48af9.m4a", "Level ini masih terkunci. Selesaikan tantangan sebelumnya terlebih dahulu.": "audio/vo_038_82c4114784.m4a"};</script>
  <script>
    /* =====================================================================
       Logika gim — alur mengikuti storyboard P_ULP_4
       ===================================================================== */
    const panggung = document.getElementById('panggung');
    function skala() { panggung.style.setProperty('--u', (panggung.clientWidth / 100) + 'px'); }
    addEventListener('resize', skala); skala();

    /* ---------- AUDIO ---------- */
    const Suara = (() => {
      let siap = false, master, bgmGain, sfxGain, bgmTimer, aktif = true, voAktif = true, volBgm = .8, volSfx = .6, voAudio = null;
      function init() {
        if (siap) return; siap = true;
        Tone.start();
        master = new Tone.Gain(1).toDestination();
        bgmGain = new Tone.Gain(.15 * volBgm).connect(master);
        sfxGain = new Tone.Gain(volSfx).connect(master);
      }
      function nada(f, d, t = 'sine', g = .18, slide) {
        if (!aktif) return; init();
        const synth = new Tone.Synth({ oscillator: { type: t }, envelope: { attack: .012, decay: d, sustain: 0, release: .02 } }).connect(sfxGain);
        synth.volume.value = Tone.gainToDb(g);
        const now = Tone.now();
        synth.triggerAttack(f, now);
        if (slide) synth.oscillator.frequency.exponentialRampToValueAtTime(slide, now + d);
        synth.triggerRelease(now + d);
        setTimeout(() => synth.dispose(), (d + .3) * 1000);
      }
      const sfx = {
        klik: () => nada(560, .07, 'square', .14, 360), hover: () => nada(940, .04, 'sine', .06),
        swish: () => nada(300, .28, 'sine', .1, 1200),
        benar: () => { nada(659, .12); setTimeout(() => nada(880, .16), 90); setTimeout(() => nada(1175, .3), 190); },
        salah: () => nada(150, .32, 'sawtooth', .17, 90),
        popup: () => nada(740, .13, 'sine', .13, 1150), tutup: () => nada(430, .09, 'square', .11, 240),
        kunci: () => { nada(190, .13, 'square', .14); setTimeout(() => nada(140, .2, 'square', .14), 130); },
        ting: () => nada(1320, .45, 'sine', .14), tick: () => nada(1050, .03, 'square', .06),
        menang: () => [0, 110, 220, 400].forEach((d, i) => setTimeout(() => nada([523, 659, 784, 1046][i], .34), d))
      };
      const pola = [329.6, 392, 493.9, 587.3, 493.9, 392];
      function bgm() {
        init(); if (bgmTimer) return; let i = 0;
        bgmTimer = setInterval(() => {
          if (!aktif) return; const f = pola[i % pola.length]; i++;
          const synth = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: .15, decay: 1.1, sustain: 0, release: .05 } }).connect(bgmGain);
          synth.volume.value = Tone.gainToDb(.09);
          const now = Tone.now();
          synth.triggerAttackRelease(f, 1.1, now);
          setTimeout(() => synth.dispose(), 1300);
        }, 580);
      }
      const POLA_LAKI = /male|pria|man\b|ardi|andika|budi|dimas|bayu|eko|hendra|joko|putra|gadu|rizky|arif/i;
      function suaraLaki() {
        const idV = speechSynthesis.getVoices().filter(x => x.lang && x.lang.toLowerCase().startsWith('id'));
        return idV.find(x => POLA_LAKI.test(x.name))
          || speechSynthesis.getVoices().find(x => POLA_LAKI.test(x.name) && /id|en/i.test(x.lang))
          || idV[0] || null;
      }
      function vo(t) {
        if (!aktif || !voAktif) return;
        stopVoAudio();
        if (typeof __VO_AUDIO__ !== 'undefined' && __VO_AUDIO__[t]) {
          voAudio = new Audio(__VO_AUDIO__[t]); voAudio.volume = 1; voAudio.play(); return;
        }
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'id-ID'; u.volume = 1;
        const v = suaraLaki();
        if (v) { u.voice = v; u.pitch = POLA_LAKI.test(v.name) ? 1 : .78; } else u.pitch = .78;
        u.rate = .98;
        speechSynthesis.speak(u);
      }
      function stopVoAudio() { if (voAudio) { voAudio.pause(); voAudio = null; } }

      const w = document.getElementById('l2Waktu'); if (w) w.textContent = Math.max(0, g2.sisa) + 's';
      const n = document.getElementById('l2Nyawa'); if (n) n.textContent = '❤️'.repeat(Math.max(0, g2.nyawa)) + '🖤'.repeat(3 - Math.max(0, g2.nyawa));
    }
    function tengahScene(id) { const r = document.getElementById(id).getBoundingClientRect(); return { clientX: r.left + r.width * .5, clientY: r.top + r.height * .3 }; }
    function siapkanSoal2() {
      hentikanL2();
      document.querySelectorAll('#s32 .opsi2').forEach(b => { b.classList.remove('pilih-benar', 'pilih-salah'); b.disabled = false; });
      g2.sisa = 15; gambarL2();
      g2.timer = setInterval(() => {
        g2.sisa--; gambarL2();
        if (g2.sisa <= 5 && g2.sisa > 0) Suara.sfx.tick();
        if (g2.sisa <= 0) { hentikanL2(); habisWaktuSoal2(); }
      }, 1000);
    }
    function habisWaktuSoal2() {
      document.querySelectorAll('#s32 .opsi2').forEach(x => x.disabled = true);
      g2.nyawa--; gambarL2(); Suara.sfx.salah();
      toast('s32', tengahScene('s32'), '<b>⏰ WAKTU HABIS!</b>Kamu tidak sempat menjawab. Nyawa berkurang satu.', true);
      Suara.vo('Waktu habis! Nyawa berkurang satu.');
      lanjutSoal2();
    }
    function lanjutSoal2() {
      setTimeout(() => {
        if (g2.nyawa <= 0) { gagal('LEVEL 2 GAGAL', 'Nyawa habis. Ingat prosedur evakuasi gempa: berlindung, gunakan tangga darurat, lalu titik kumpul.', 's32'); return; }
        if (g2.i < SOAL2.length - 1) { g2.i++; siapkanSoal2(); }
        else selesaiL2();
      }, 1400);
    }
    document.querySelectorAll('#s32 .opsi2').forEach(b => {
      b.addEventListener('click', e => {
        if (b.disabled) return;
        hentikanL2();
        const s = SOAL2[g2.i], i = +b.dataset.opsi, benar = i === s.b;
        document.querySelectorAll('#s32 .opsi2').forEach(x => x.disabled = true);
        b.classList.add(benar ? 'pilih-benar' : 'pilih-salah');
        benar ? Suara.sfx.benar() : (Suara.sfx.salah(), g2.nyawa--);
        gambarL2();
        toast('s32', e, `<b>${benar ? '✅ TEPAT' : '❌ KURANG TEPAT'}</b>${s.f}`, !benar);
        Suara.vo(s.f);
        if (benar) g2.benar++;
        lanjutSoal2();
      });
    });
    function selesaiL2() {
      const skor = Math.round(35 * (g2.benar / SOAL2.length));
      progres.level.l2 = { skor, benar: g2.benar }; simpan(); Suara.sfx.menang();
      popupInfo('✅ LEVEL 2 SELESAI', `Jawaban tepat <b>${g2.benar} dari ${SOAL2.length}</b> situasi darurat. Skor level: <b>${skor} poin</b>.`,
        [{ t: 'MENU LEVEL', k: 'abu', f: () => ke('s3') }, { t: 'LANJUT KE LEVEL 3 →', k: 'hijau', f: () => ke('s33') }]);
    }
    function gambarSoal2() { } // placeholder tidak dipakai — pertanyaan sudah tergambar di mockup

    /* ---------- LEVEL 3 : DRAG & DROP GROOMING ---------- */
    const ITEM = { id: { zona: 'id' }, kemeja: { zona: 'kemeja' }, sepatu: { zona: 'sepatu' }, sandal: { zona: null } };
    let g3 = { pilih: null, terpasang: {}, sisa: 60, timer: null };
    function hentikanL3() { if (g3.timer) { clearInterval(g3.timer); g3.timer = null; } }
    function gambarL3() { const w = document.getElementById('l3Waktu'); if (w) w.textContent = Math.max(0, g3.sisa) + 's'; }
    function mulaiL3() {
      hentikanL3();
      g3 = { pilih: null, terpasang: {}, sisa: 60, timer: null };
      document.querySelectorAll('#s33 [data-item]').forEach(el => el.classList.remove('terpakai'));
      document.querySelectorAll('#s33 .dzstat').forEach(el => el.style.display = 'none');
      document.querySelectorAll('#s33 .itemdot').forEach(el => el.classList.remove('on'));
      document.getElementById('btnCekHasil').disabled = true;
      gambarL3();
      g3.timer = setInterval(() => {
        g3.sisa--; gambarL3();
        if (g3.sisa <= 10 && g3.sisa > 0) Suara.sfx.tick();
        if (g3.sisa <= 0) { hentikanL3(); gagal('LEVEL 3 GAGAL', 'Waktu habis sebelum seluruh atribut grooming terpasang.', 's33'); }
      }, 1000);
    }
    document.querySelectorAll('#s33 [data-item]').forEach(el => {
      el.onclick = () => { if (el.classList.contains('terpakai')) return; Suara.sfx.klik(); g3.pilih = el.dataset.item; };
    });
    document.querySelectorAll('#s33 .dz').forEach(z => {
      z.onclick = () => {
        if (!g3.pilih) { Suara.sfx.kunci(); return; }
        const it = ITEM[g3.pilih], zonaId = z.dataset.zona;
        if (it.zona !== zonaId) {
          Suara.sfx.salah();
          z.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 300 });
          Suara.vo('Item ini tidak sesuai standar grooming pemandu wisata. Ditolak otomatis.');
          g3.pilih = null; return;
        }
        Suara.sfx.benar();
        document.getElementById('item' + g3.pilih.charAt(0).toUpperCase() + g3.pilih.slice(1)).classList.add('terpakai');
        document.getElementById('dzstat-' + zonaId).style.display = 'block';
        g3.terpasang[zonaId] = true;
        const n = Object.keys(g3.terpasang).length;
        document.getElementById('dot' + (n - 1)).classList.add('on');
        g3.pilih = null;
        if (n === 3) { hentikanL3(); document.getElementById('btnCekHasil').disabled = false; Suara.sfx.menang(); }
      };
    });
    document.getElementById('btnCekHasil').onclick = () => {
      if (document.getElementById('btnCekHasil').disabled) return;
      Suara.sfx.menang();
      progres.level.l3 = { skor: 35 }; simpan();
      popupInfo('✅ LEVEL 3 SELESAI — LULUS', 'Seluruh atribut grooming terpasang sesuai <b>Tour Guide Grooming Standard</b>: lencana/ID card, kemeja seragam berlogo, dan sepatu lapangan tertutup.',
        [{ t: '🏅 TERBITKAN SERTIFIKAT →', k: 'hijau', f: () => ke('s34') }]);
    };

    function gagal(judul, pesan, ulang) {
      Suara.sfx.salah();
      popupInfo('❌ ' + judul, pesan, [{ t: 'MENU LEVEL', k: 'abu', f: () => ke('s3') }, { t: '🔁 ULANGI LEVEL', k: 'oranye', f: () => ke(ulang) }]);
    }

    /* ---------- SERTIFIKASI ---------- */
    function skorTotal() { return ['l1', 'l2', 'l3'].reduce((a, k) => a + ((progres.level[k] && progres.level[k].skor) || 0), 0); }
    function gambarSertifikat() {
      const total = Math.min(100, skorTotal() + (progres.insp >= 3 ? 5 : 0) + (Object.keys(progres.baca || {}).length >= 5 ? 5 : 0));
      document.getElementById('sertifSkor').innerHTML = 'TOTAL SKOR: ' + total + '<span style="font-size:.45em;color:#cfe6ff"> / 100</span>';
      const b = total >= 90 ? 5 : total >= 75 ? 4 : total >= 60 ? 3 : 2;
      document.getElementById('sertifBintang').textContent = '★'.repeat(b) + '☆'.repeat(5 - b);
      document.getElementById('sertifStatus').textContent = 'STATUS: ' + (total >= 75 ? 'KOMPETEN PROFESIONAL ULP' : 'PERLU PENGUATAN KOMPETENSI');
      Suara.sfx.menang();
    }
    document.getElementById('btnUnduh').onclick = () => {
      Suara.sfx.klik();
      const c = document.createElement('canvas'); c.width = 1200; c.height = 850;
      const x = c.getContext('2d');
      x.fillStyle = '#fffdf5'; x.fillRect(0, 0, 1200, 850);
      x.strokeStyle = '#c9a227'; x.lineWidth = 12; x.strokeRect(28, 28, 1144, 794);
      x.lineWidth = 3; x.strokeRect(52, 52, 1096, 746);
      x.textAlign = 'center'; x.fillStyle = '#8a6a12';
      x.font = 'bold 46px Georgia,serif'; x.fillText('SERTIFIKAT KOMPETENSI', 600, 180);
      x.fillStyle = '#3a2f16'; x.font = '22px Georgia,serif'; x.fillText('diberikan kepada', 600, 240);
      x.fillStyle = '#8a6a12'; x.font = 'bold 52px Georgia,serif'; x.fillText('TourGuide_Andi', 600, 310);
      x.strokeStyle = '#c9a227'; x.lineWidth = 3; x.beginPath(); x.moveTo(340, 330); x.lineTo(860, 330); x.stroke();
      x.fillStyle = '#3a2f16'; x.font = '24px Georgia,serif';
      x.fillText('sebagai PERSONEL USAHA LAYANAN PARIWISATA', 600, 390);
      x.fillText('SADAR PROSEDUR K3 & PELAYANAN PRIMA', 600, 428);
      x.font = '19px Georgia,serif';
      x.fillText('Modul IV — Prosedur Kesehatan, Keselamatan, Keamanan & Standar Grooming', 600, 486);
      x.font = 'bold 40px Georgia,serif'; x.fillStyle = '#1f8f57';
      x.fillText(document.getElementById('sertifSkor').textContent.trim(), 600, 566);
      x.fillStyle = '#c9a227'; x.font = '40px Georgia,serif';
      x.fillText(document.getElementById('sertifBintang').textContent, 600, 626);
      x.fillStyle = '#3a2f16'; x.font = '18px Georgia,serif';
      x.fillText(document.getElementById('sertifStatus').textContent, 600, 668);
      x.fillText(new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }), 600, 720);
      x.fillText('Disahkan oleh Pembina Kompetensi ULP', 600, 760);
      const a = document.createElement('a'); a.download = 'Sertifikat-Kompetensi-ULP.png'; a.href = c.toDataURL('image/png'); a.click();
    };

    /* ---------- EVENT GLOBAL ---------- */
    document.addEventListener('click', e => {
      const g = e.target.closest('[data-go]');
      if (g) { Suara.sfx.klik(); ke(g.dataset.go, 'geser'); return; }
      const f = e.target.closest('[data-flip]');
      if (f) { Suara.sfx.klik(); bukaFlip(f.dataset.flip); return; }
      const m = e.target.closest('[data-modal]');
      if (m) { Suara.sfx.klik(); bukaTirai(m.dataset.modal); return; }
      if (e.target.closest('[data-tutup]')) { Suara.sfx.tutup(); Suara.redam(false); e.target.closest('.tirai').classList.remove('tampil'); return; }
      const lv = e.target.closest('[data-level]');
      if (lv) {
        const i = +lv.dataset.level;
        if (!terbuka(i)) {
          Suara.sfx.kunci();
          lv.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 });
          Suara.vo('Level ini masih terkunci. Selesaikan tantangan sebelumnya terlebih dahulu.'); return;
        }
        Suara.sfx.klik(); ke(LEVEL[i].ke);
      }
    });
    document.addEventListener('mouseenter', e => {
      if (e.target.classList && e.target.classList.contains('hot')) Suara.sfx.hover();
    }, true);

    /* pengaturan */
    let simpanSementara = { bgm: 80, sfx: 60, vo: true };
    function terapkanBgm(v) {
      Suara.setBgm(v / 100);
      document.getElementById('pinBgm').style.left = (47 + v * .38 - 2.25) + '%';
      document.getElementById('fillBgm').style.width = (v * .38) + '%';
      document.getElementById('txtBgm').textContent = v + '%';
    }
    function terapkanSfx(v) {
      Suara.setSfx(v / 100);
      document.getElementById('pinSfx').style.left = (47 + v * .38 - 2.25) + '%';
      document.getElementById('fillSfx').style.width = (v * .38) + '%';
      document.getElementById('txtSfx').textContent = v + '%';
    }
    document.getElementById('rngBgm').oninput = function () { terapkanBgm(+this.value); };
    document.getElementById('rngSfx').oninput = function () { terapkanSfx(+this.value); };
    terapkanBgm(80); terapkanSfx(60);
    document.getElementById('swVo').onclick = function () {
      simpanSementara.vo = !simpanSementara.vo; Suara.setVo(simpanSementara.vo); Suara.sfx.klik();
    };
    document.getElementById('btnSimpan').onclick = () => {
      simpanSementara = { bgm: +document.getElementById('rngBgm').value, sfx: +document.getElementById('rngSfx').value, vo: simpanSementara.vo };
      Suara.sfx.benar(); Suara.redam(false); document.getElementById('mSet').classList.remove('tampil');
    };
    document.getElementById('btnKeluarYa').onclick = () => {
      simpan(); Suara.sfx.tutup(); Suara.setAktif(false);
      document.getElementById('mExit').classList.remove('tampil');
      document.body.innerHTML = '<div style="position:absolute;inset:0;display:grid;place-items:center;background:#03101d;color:#fff;' +
        'font-family:Segoe UI,system-ui,sans-serif;text-align:center;padding:24px"><div><div style="font-size:64px">👋</div>' +
        '<h2 style="margin:12px 0">Terima kasih atas dedikasimu hari ini!</h2>' +
        '<p style="opacity:.8">Sampai jumpa di modul berikutnya. Muat ulang halaman untuk memulai kembali.</p></div></div>';
      try { window.close(); } catch (e) { }
    };

    /* ---------- INIT ---------- */
    function audioSekaliKlik() {
      Suara.init(); Suara.bgm();
      removeEventListener('pointerdown', audioSekaliKlik); setTimeout(() => Suara.vo(VO.s0), 250);
    }
    addEventListener('pointerdown', audioSekaliKlik);
  </script>
</body>

</html>
